<title>Vatio EV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: columna móvil de una mano. Arriba el estado de la batería, debajo herramientas en tarjetas, barra de pestañas fija. Las cifras van en tipografía display y tabulares. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#E7EEEC; --line:#D5DFDD; --fg:#0C1B1A; --muted:#55686A;
  --accent:#0A7C78; --accent-ink:#FFFFFF; --accent-soft:#D3ECE9;
  --ok:#1B7F4B; --ok-soft:#DDF1E6; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B8342B; --bad-soft:#F9DEDB;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --seq1:#BFE4DF; --seq2:#5FB7AF; --seq3:#0A6B67;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1413; --surface:#111E1D; --surface2:#182927; --line:#243836; --fg:#E6F1EF; --muted:#8CA5A2;
    --accent:#3FCBC3; --accent-ink:#04201F; --accent-soft:#103936;
    --ok:#4CC17F; --ok-soft:#12301F; --warn:#E7A93A; --warn-soft:#38290E; --bad:#EF7A70; --bad-soft:#3B1816;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --seq1:#164A46; --seq2:#2A8E87; --seq3:#8FE6DF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1413; --surface:#111E1D; --surface2:#182927; --line:#243836; --fg:#E6F1EF; --muted:#8CA5A2;
  --accent:#3FCBC3; --accent-ink:#04201F; --accent-soft:#103936;
  --ok:#4CC17F; --ok-soft:#12301F; --warn:#E7A93A; --warn-soft:#38290E; --bad:#EF7A70; --bad-soft:#3B1816;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --seq1:#164A46; --seq2:#2A8E87; --seq3:#8FE6DF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs,15px);line-height:1.45;padding-inline:16px;padding-block:0;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.3rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{display:flex;flex-direction:column;gap:14px;padding-bottom:104px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.plain{background:transparent;border-style:dashed}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv{background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-family:var(--f-display);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv span{font-size:.78rem;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:600;font-size:2.6rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:1.1rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}

.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-weight:500;font-size:.88rem;color:var(--muted);min-width:0}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;color:var(--fg);min-width:40px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:.72rem;color:var(--muted);white-space:nowrap}

label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);min-width:0}
input[type=number],input[type=text],input[type=date],select{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);padding:10px 12px;font-size:16px;color:var(--fg);min-width:0;font-family:var(--f-body)}
input:focus,select:focus{border-color:var(--accent);outline:none}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}
.fieldrow{display:flex;align-items:center;gap:8px}
.unit{font-size:.8rem;color:var(--muted);white-space:nowrap}
.btn{border:0;border-radius:var(--r-sm);padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.sm{padding:7px 12px;font-size:.84rem}
.link{color:var(--accent);font-weight:500}
.rowl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.rowl:first-child{border-top:0}
.rowl .t{min-width:0;display:flex;flex-direction:column}
.rowl .t b{font-weight:500;overflow-wrap:anywhere}
.x{border:0;background:var(--surface2);border-radius:var(--r-sm);width:40px;height:40px;font-size:1.2rem;color:var(--muted);flex:0 0 auto}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);min-width:0}
.stat b{font-family:var(--display);font-size:1.15rem;font-weight:600}
.note{border-radius:var(--r-sm);padding:10px 12px;background:var(--surface2);font-size:.88rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:.72rem;font-weight:500;border-radius:12px}
.tabbar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}

.gauge{width:100%;height:auto;display:block}
.svt{fill:var(--muted);font:10px var(--f-body)}
.svt.fg{fill:var(--fg)}
.svt.lbl{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px}
.legend i.circ{border-radius:50%}
.legend i.dia{transform:rotate(45deg);border-radius:1px}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.barrow .trk{grid-column:1/-1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.barrow .trk i{display:block;height:100%;background:var(--muted);opacity:.55;border-radius:99px}
.barrow.best .trk i{background:var(--accent);opacity:1}
details.tbl summary{cursor:pointer;color:var(--accent);font-size:.84rem;font-weight:500}
.tblwrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.tip{position:fixed;z-index:50;background:var(--fg);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:.8rem;line-height:1.35;pointer-events:none;white-space:pre-line;max-width:230px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.86rem;z-index:60;max-width:90vw;text-align:center}
.planbox{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm)}
.days{display:flex;gap:6px}
.days .chip{flex:1;padding:8px 0;text-align:center;min-width:0}
@media (max-width:420px){ .big{font-size:2.3rem} }
#gmap{height:320px;border-radius:var(--r-sm);border:1px solid var(--line);overflow:hidden;background:var(--surface2);isolation:isolate}
.leaflet-container{font-family:var(--f-body)}
.dark-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.gpw{background:none;border:0}
.gp{display:block;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--muted);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gp.free{border-color:var(--accent);background:var(--accent)}
.gp.sel{outline:3px solid var(--fg);outline-offset:2px}
.gp.off{opacity:.45}
.gp.maybe{border-color:var(--accent);background:var(--surface)}
.mapbar{display:flex;gap:8px;flex-wrap:wrap}
.mapbar input{flex:1;min-width:140px}
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--surface));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--accent);opacity:.12}
.rowbtn{background:none;border:0;padding:0;text-align:left;display:flex;min-width:0;flex:1}
@media (prefers-reduced-motion:no-preference){
  main.vin>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .gauge .fillc{transform-box:fill-box;transform-origin:left center;animation:fillx .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--k,0)*70ms)}
  @keyframes fillx{from{transform:scaleX(0)}to{transform:none}}
  .barrow .trk i{transform-origin:left center;animation:fillx .8s cubic-bezier(.2,.8,.2,1) both .2s}
  .tabbar button{transition:color .2s,background .25s,transform .15s}
  .tabbar button[aria-current="page"]{background:var(--accent-soft)}
  .tabbar button[aria-current="page"] svg{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
  .tabbar button:active,.btn:active,.chip:active{transform:scale(.94)}
  .btn,.chip,.seg button{transition:transform .15s,background .2s,color .2s,border-color .2s}
  .gp{animation:pinpop .45s cubic-bezier(.3,1.7,.5,1) both}
  @keyframes pinpop{from{transform:scale(0)}to{transform:scale(1)}}
  .rowl{transition:background .2s}
  .toast{animation:rise .3s ease-out both}
}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;font-size:.84rem;text-align:left;min-width:0}
.sw i{width:18px;height:18px;border-radius:50%;background:var(--c);flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pre{background:var(--surface2);border-radius:var(--r-sm);padding:10px;font:.78rem/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
input[type=color]{width:100%;height:44px;padding:2px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
</style>

    <div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="8" width="22" height="12" rx="3.5" fill="none" stroke="var(--accent)" stroke-width="2.2"/><rect x="24.5" y="12" width="2.5" height="4" rx="1" fill="var(--accent)"/><path d="M13.5 10.5l-3.5 4h3l-1 3.5 4-4.5h-3z" fill="var(--accent)"/></svg>Vatio</div>

<script>
(function(){
'use strict';
var KEY='vatio.v1';
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function nf(v,d){d=d||0;return Number(v).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d})}
function eur(v,d){d=(d===undefined)?2:d;return Number(v).toLocaleString('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d})}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function num(v,def){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:(def||0)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function median(a){var b=a.slice().sort(function(x,y){return x-y}),n=b.length;if(!n)return null;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2}
function fmtH(h){if(!isFinite(h)||h<=0)return '0 min';var m=Math.round(h*60);var hh=Math.floor(m/60),mm=m%60;return hh>0?(hh+' h '+(mm<10?'0':'')+mm+' min'):(mm+' min')}
function iso(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day}
function parseD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function daysAgoStr(n){var d=new Date();d.setDate(d.getDate()-n);return iso(d)}
function dmy(s){var p=String(s).split('-');return p.length===3?(p[2]+'/'+p[1]+'/'+p[0].slice(2)):s}
function hh2(h){return (h<10?'0':'')+h+':00'}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function round(v,d){var k=Math.pow(10,d||0);return Math.round(v*k)/k}

function seed(s){
  var rows=[[97,'casa',24,80],[90,'casa',30,85],[83,'dc',12,80],[76,'casa',28,82],[69,'casa',35,80],[62,'ac',20,75],[55,'casa',31,80],[48,'casa',26,80],[41,'dc',10,78],[34,'casa',33,80],[27,'casa',29,82],[20,'casa',36,80],[13,'casa',27,80],[6,'casa',31,80]];
  var noise=[0.01,-0.012,0.008,-0.006,0.012,-0.01,0.004,0.009,-0.008,0.006,-0.012,0.01,-0.004,0.007];
  var odo=18240;
  s.log=rows.map(function(r,i){
    var soh=93.4+2.0*(r[0]/97);
    var cap=s.car.nominal*soh/100;
    var kwh=round(cap*(r[3]-r[2])/100/s.eff[r[1]]*(1+noise[i]),1);

/* ---------- Modelo ---------- */
function fTemp(T){return 1+Math.max(0,20-T)*0.012+Math.max(0,T-25)*0.006}
function periodOf(day,h){
  if(day===0||day===6)return 'valle';
  if(h<8)return 'valle';
  if(h<10)return 'llano';
  if(h<14)return 'punta';
  if(h<18)return 'llano';
  if(h<22)return 'punta';
  return 'llano';
}
function sohPoints(){
  var pts=[];
  S.log.forEach(function(l){
    var d=l.to-l.from;
    if(!(d>=30)||!(l.kwh>0))return;
    var cap=l.kwh*(S.eff[l.type]||0.9)/(d/100);
    var soh=cap/S.car.nominal*100;
    if(soh<40||soh>115)return;
    pts.push({id:l.id,date:l.date,soh:soh,src:'calc',ex:!!l.ex});
  });
  S.reads.forEach(function(r){pts.push({id:r.id,date:r.date,soh:r.pct,src:'manual',ex:!!r.ex})});
  pts.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0)});
  return pts;
}
function sohSummary(){
  var pts=sohPoints();
  var calc=pts.filter(function(p){return p.src==='calc'});
  var man=pts.filter(function(p){return p.src==='manual'});
  var res={pts:pts,n:calc.length,man:man.length?man[man.length-1]:null,val:null,lo:null,hi:null,basis:'',used:0};
  var use=calc.slice(-6);
  if(use.length>=2){var v=use.map(function(p){return p.soh});res.val=median(v);res.lo=Math.min.apply(null,v);res.hi=Math.max.apply(null,v);res.basis='calc';res.used=use.length}
  else if(man.length){res.val=man[man.length-1].soh;res.lo=res.hi=res.val;res.basis='manual';res.used=1}
  if(res.val!==null)res.cap=S.car.nominal*res.val/100;
  var last=pts.length?pts[pts.length-1].date:null;
  res.age=last?Math.round((Date.now()-parseD(last).getTime())/864e5):null;
  return res;
}
function verdict(v){

}
function trend(pts){
  var n=pts.length;if(n<4)return null;
  var t0=parseD(pts[0].date).getTime(),sx=0,sy=0,sxx=0,sxy=0;
  pts.forEach(function(p){var x=(parseD(p.date).getTime()-t0)/864e5,y=p.soh;sx+=x;sy+=y;sxx+=x*x;sxy+=x*y});
  var span=(parseD(pts[n-1].date).getTime()-t0)/864e5;if(span<90)return null;
  var den=n*sxx-sx*sx;if(den===0)return null;
  var b=(n*sxy-sx*sy)/den,a=(sy-b*sx)/n;
  return {a:a,b:b,span:span,perYear:b*365,t0:t0};
}

/* Simulación de la rutina de carga en casa */
function weeklyKwh(r){return r.kmWeek*r.homeShare/100*S.car.cons/100/S.eff.casa}
function simRoutine(r,startH){
  var out={punta:0,llano:0,valle:0},hours=[];for(var i=0;i<24;i++)hours.push(0);
  var days=r.days||[],kw=Math.max(0.5,r.kw),kwhWeek=weeklyKwh(r);
  if(!days.length||kwhWeek<=0)return {e:out,hours:hours,week:0};
  var per=kwhWeek/days.length;
  days.forEach(function(d,idx){
    var rem=per,h=startH,day=d,g=0;
    while(rem>1e-9&&g++<400){
      var e=Math.min(kw,rem);out[periodOf(day,h)]+=e;if(idx===0)hours[h]+=e;rem-=e;h++;if(h>=24){h=0;day=(day+1)%7}
    }
  });

  return {e:{punta:out.punta*f,llano:out.llano*f,valle:out.valle*f},hours:hours,week:kwhWeek};
}

}

  var best=null;
  for(var h=0;h<24;h++){var s=simRoutine(S.routine,h);var c=planCost(p,s.e);if(!best||c<best.cost-1e-9)best={h:h,cost:c}}
  return best;
}

  var max=Math.max.apply(null,ms.map(function(m){return m.total}).concat([1]));
  var ymax=Math.ceil(max/10)*10;if(ymax<10)ymax=10;
  var W=340,H=200,l=34,r=8,t=18,b=26,pw=W-l-r,ph=H-t-b,bw=pw/ms.length;
  function Y(v){return t+ph-v/ymax*ph}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gasto en carga por mes">';
  [0,ymax/2,ymax].forEach(function(v){s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)"/><text class="svt" x="'+(l-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+nf(v,0)+' €</text>'});
  var cols={casa:'var(--s1)',ac:'var(--s2)',dc:'var(--s3)'},names={casa:'Casa',ac:'Pública lenta',dc:'Pública rápida'};
  ms.forEach(function(m,i){
    var x=l+i*bw+bw*0.16,w=bw*0.68,acc=0;
    ['casa','ac','dc'].forEach(function(k){
      if(m[k]<=0)return;
      var y1=Y(acc+m[k]),y0=Y(acc),hh=Math.max(0,y0-y1-2);
      s+='<rect x="'+x.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="3" fill="'+cols[k]+'" data-tip="'+esc(m.label+' · '+names[k]+'\n'+eur(m[k]))+'"/>';
      acc+=m[k];
    });
    if(m.total>0)s+='<text class="svt fg lbl" x="'+(x+w/2).toFixed(1)+'" y="'+(Y(m.total)-5).toFixed(1)+'" text-anchor="middle">'+nf(m.total,0)+'</text>';
    s+='<text class="svt" x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(m.label)+'</text>';
  });
  return s+'</svg>';
}
function startChart(p,cur){
  var costs=[];for(var h=0;h<24;h++)costs.push(planCost(p,simRoutine(S.routine,h).e));
  var min=Math.min.apply(null,costs),max=Math.max.apply(null,costs);
  var W=340,H=170,l=34,r=6,t=10,b=24,pw=W-l-r,ph=H-t-b,bw=pw/24;
  var ymax=Math.ceil(max/5)*5;if(ymax<=0)ymax=5;
  function Y(v){return t+ph-v/ymax*ph}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Coste mensual según la hora de inicio de la carga">';
  [0,ymax/2,ymax].forEach(function(v){s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)"/><text class="svt" x="'+(l-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+nf(v,0)+' €</text>'});
  costs.forEach(function(c,h){
    var x=l+h*bw+bw*0.15,w=bw*0.7,best=Math.abs(c-min)<1e-9;
    s+='<rect x="'+x.toFixed(1)+'" y="'+Y(c).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(t+ph-Y(c)).toFixed(1)+'" rx="2" fill="'+(best?'var(--accent)':'var(--muted)')+'" opacity="'+(best?'1':'.45')+'"'+(h===cur?' stroke="var(--fg)" stroke-width="1.5"':'')+' data-tip="'+esc('Empezar a las '+hh2(h)+'\n'+eur(c)+' al mes')+'"/>';
    if(h%3===0)s+='<text class="svt" x="'+(x+w/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+h+'</text>';
  });
  return s+'</svg>';
}
function stripChart(sim,startH){
  var W=340,H=110,l=6,r=6,pw=W-l-r,bw=pw/24,maxE=Math.max.apply(null,sim.hours.concat([0.01]));
  var cols={valle:'var(--seq1)',llano:'var(--seq2)',punta:'var(--seq3)'},nm={valle:'Valle',llano:'Llano',punta:'Punta'};
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Tramos de la tarifa y horas de carga de un día laborable">';
  var baseY=62,hMax=44;
  for(var h=0;h<24;h++){
    var x=l+h*bw,per=periodOf(1,h),e=sim.hours[h];
    if(e>0){var hh=Math.max(3,e/maxE*hMax);s+='<rect x="'+(x+bw*0.18).toFixed(1)+'" y="'+(baseY-4-hh).toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="2" fill="var(--accent)" data-tip="'+esc(hh2(h)+'\nCargas '+nf(e,1)+' kWh')+'"/>'}
    s+='<rect x="'+(x+0.5).toFixed(1)+'" y="'+baseY+'" width="'+(bw-1).toFixed(1)+'" height="22" fill="'+cols[per]+'" stroke="var(--line)" stroke-width=".6" data-tip="'+esc(hh2(h)+'\n'+nm[per]+' (laborables)')+'"/>';
    if(h%3===0)s+='<text class="svt" x="'+(x+bw/2).toFixed(1)+'" y="'+(baseY+36)+'" text-anchor="middle">'+h+'</text>';
  }
  return s+'<text class="svt" x="'+l+'" y="10">kWh por hora de tu carga</text></svg>';
}

  if(NEED.km<=0)return '<p class="muted">Indica los kilómetros de mañana.</p>';
  if(target>100)return '<div class="note warn">Con una sola carga no llegas ('+nf(needPct,0)+' % de batería solo para el trayecto). Planifica una parada de carga.</div>';

function saveFile(filename,data,fallbackText){
  if(!(window.claude&&window.claude.use)){
    try{var bl=new Blob([data],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);if(a.parentNode)a.parentNode.removeChild(a)},500);toast('Archivo descargado');return}catch(e){}
    copyText(fallbackText||data);return}
  window.claude.use('downloads').then(function(d){
    if(!d){copyText(fallbackText||data);return}
    return d.save({filename:filename,data:data}).then(function(){toast('Archivo guardado')},function(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo');});
  });
}

/* ---------- AUTONOMÍA REAL Y CALIDAD DE LA ESTIMACIÓN ---------- */
function rangeStats(){
  var L=S.log.filter(function(l){return l.odo>0}).sort(function(a,b){return a.odo-b.odo}),pts=[];
  for(var i=1;i<L.length;i++){
    var km=L[i].odo-L[i-1].odo,used=L[i-1].to-L[i].from;
    if(km>=20&&km<=900&&used>=15&&used<=95)pts.push({date:L[i].date,km:km,used:used,range:km/used*100,cons:(used/100*capNow())/km*100});
  }
  var use=pts.slice(-8);
  if(!use.length)return {n:0,pts:pts};
  var r=use.map(function(p){return p.range}),c=use.map(function(p){return p.cons});
  return {n:use.length,pts:pts,range:median(r),lo:Math.min.apply(null,r),hi:Math.max.apply(null,r),cons:median(c)};
}

function qualityHTML(){

/* ---------- VIAJE ---------- */
var SPEEDF={90:0.88,100:0.94,110:1,120:1.1,130:1.22};
function tripCalc(){
  var t=S.trip,cap=capNow(),cons=S.car.cons*(SPEEDF[t.speed]||1)*fTemp(t.temp)/fTemp(15);
  var need=t.km*cons/100,avail=cap*Math.max(0,t.soc-t.arr)/100,toCharge=Math.max(0,need-avail);
  var perStop=Math.max(1,cap*0.6),stops=toCharge>0?Math.ceil(toCharge/perStop):0;
  var kw=Math.max(20,Math.min(S.car.dc,150)*0.65),billed=toCharge/S.eff.dc;
  var arrive=Math.max(0,t.soc-need/cap*100+(toCharge/cap*100));
  return {need:need,cons:cons,toCharge:toCharge,stops:stops,mins:toCharge/kw*60+stops*5,cost:billed*S.price.dc,home:need/S.eff.casa*S.price.casa,gas:t.km*S.gas.l100/100*S.gas.price,arrive:arrive,cap:cap};
}
function tripOutHTML(){
  var r=tripCalc(),t=S.trip,h='';
  h+='<div class="grid2"><div class="stat"><span class="muted small">Energía del viaje</span><b class="num">'+nf(r.need,0)+' kWh</b></div><div class="stat"><span class="muted small">Consumo previsto</span><b class="num">'+nf(r.cons,1)+' kWh/100 km</b></div>'
   +'<div class="stat"><span class="muted small">Paradas a cargar</span><b class="num">'+r.stops+'</b></div><div class="stat"><span class="muted small">Tiempo cargando</span><b class="num">'+(r.toCharge>0?fmtH(r.mins/60):'0 min')+'</b></div></div>';
  h+='<div class="note">'+(r.toCharge>0?'Necesitas cargar unos <b>'+nf(r.toCharge,0)+' kWh</b> por el camino: cuestan unos <b>'+eur(r.cost)+'</b> con tu precio de carga rápida, frente a <b>'+eur(r.gas)+'</b> en gasolina.':'Llegas sin parar a cargar. Si cargaras todo en casa costaría unos <b>'+eur(r.home)+'</b>, frente a <b>'+eur(r.gas)+'</b> en gasolina.')+'</div>';
  if(r.need>r.cap*0.9)h+='<div class="note warn">El viaje pide casi toda la batería. Planifica las paradas con antelación.</div>';
  h+='<p class="muted small">Estimación aproximada: usa la capacidad real que calcula la app, ajusta el consumo por velocidad y temperatura, y supone paradas del 10 al 70 % a unos dos tercios de la potencia máxima de tu coche. No incluye pendientes, viento ni carga con la calefacción a tope.</p>';
  return h;
}
function viajeView(){
  var t=S.trip;
  var html='<section class="card"><h3>Calculadora de viaje</h3><div class="grid2">'+fld('vK','Distancia',t.km,{unit:'km',min:1})+fld('vT','Temperatura',t.temp,{unit:'°C'})+fld('vS','Batería al salir',t.soc,{unit:'%',min:10,max:100})+fld('vA','Llegar con al menos',t.arr,{unit:'%',min:0,max:50})
   +'<label class="f" for="vV">Velocidad media<select id="vV">'+[90,100,110,120,130].map(function(v){return '<option value="'+v+'"'+(t.speed===v?' selected':'')+'>'+v+' km/h</option>'}).join('')+'</select></label></div></section>'
   +'<section class="card"><h3>Resultado</h3><div id="viOut" style="display:flex;flex-direction:column;gap:12px">'+tripOutHTML()+'</div></section>'+rutaCardHTML();

    var rd=function(){var t=S.trip;t.km=Math.max(1,num($('#vK').value,1));t.temp=clamp(num($('#vT').value,15),-20,45);t.soc=clamp(num($('#vS').value,90),10,100);t.arr=clamp(num($('#vA').value,10),0,50);t.speed=parseInt($('#vV').value,10)||120;save();$('#viOut').innerHTML=tripOutHTML()};

function getKey(){

    if(!k){var o=JSON.parse(localStorage.getItem('enchufa.v2')||'null');var ok=o&&o.keys&&o.keys.ocm;if(ok&&String(ok).trim()){k=String(ok).trim();localStorage.setItem(OCMKEY,k)}}

}

function hav(a,b,c,d){var R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p;var q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(q))}
function jget(url,ms){
  var ctl=('AbortController' in window)?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},ms||20000);
  return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('error '+r.status);return r.json()},function(e){clearTimeout(to);throw e});
}
var FREE_RE=/\b(free|gratis|gratuit[oa]s?|gratuït|sin coste|sin cargo|sin costo|no cost|kostenlos|free of charge|libre de coste)\b|(^|[^\d.,])0([.,]0+)?\s*(€|eur|euro)|^\s*(€|eur)\s*0([.,]0+)?\s*$/i;
var NOTFREE_RE=/\b(not free|no gratis|no es gratis|non[- ]free)\b/i;
var MAYBE_RE=/lidl|ikea|carrefour|corte ingl[eé]s|ahorram[aá]s|mcdonald|burger king|starbucks|hotel|parador|aeropuerto|airport|aena|ayuntamiento|universidad|biblioteca|centro comercial|hipermercado|mercadona|alcampo|eroski|supermercado/i;
var PAID_RE=/decathlon|leroy|costco|iberdrola|endesa|repsol|ionity|zunder|tesla|supercharger|wenea|powerdot|pulsing|cepsa|moeve|plenitude|shell recharge|fastned/i;

  if(!hasPrice&&MAYBE_RE.test(txt)&&!PAID_RE.test(p.op+' '+p.n))return 'maybe';

function normOCM(p){
  if(!p||!p.AddressInfo)return null;
  var a=p.AddressInfo,kw=0,cs=[];
  (p.Connections||[]).forEach(function(c){var pw=num(c.PowerKW,0);if(pw>kw)kw=pw;var t=c.ConnectionType&&c.ConnectionType.Title;if(t){t=String(t).replace(/\(.*?\)/g,'').trim().slice(0,18);if(cs.indexOf(t)<0)cs.push(t)}});

  return {id:'o'+p.ID,n:a.Title||'Punto de carga',lat:lat,lon:lon,kw:kw,conn:cs,cost:cost,
    free:isFreeCost(cost),cls:'other',
    s:st,addr:[a.AddressLine1,a.Town].filter(Boolean).join(', '),op:(p.OperatorInfo&&p.OperatorInfo.Title)||'',upd:String(p.DateLastVerified||p.DateLastStatusUpdate||'').slice(0,10),np:p.NumberOfPoints||0};
}

var restoreArm=false;
function backupText(){return JSON.stringify({app:'vatio',v:1,date:iso(new Date()),state:S},null,1)}
function restoreFrom(txt){
  var o;try{o=JSON.parse(txt)}catch(e){toast('El archivo no es una copia de Vatio');return false}
  var st=o&&o.app==='vatio'&&o.state;
  if(!st||typeof st!=='object'||!Array.isArray(st.log)){toast('El archivo no es una copia de Vatio');return false}
  S=merge(defaults(),st);save();applyTheme();render();toast('Copia restaurada: '+S.log.length+' cargas');return true;
}

/* ---------- PRECIO DE LA LUZ HOY (versión alojada) ---------- */
var TODAY={prices:null,status:'',loading:false,hours:3};
function parseREE(j){
  var inc=(j&&j.included)||[],pick=null;
  inc.forEach(function(x){if(!pick&&x&&/pvpc/i.test(String(x.type||'')+' '+String((x.attributes&&x.attributes.title)||'')))pick=x});
  if(!pick||!pick.attributes||!pick.attributes.values)return null;
  var out=[];for(var i=0;i<24;i++)out.push(null);
  pick.attributes.values.forEach(function(v){var hh=parseInt(String(v.datetime).substr(11,2),10);if(hh>=0&&hh<24&&isFinite(v.value))out[hh]=v.value/1000});
  return out.some(function(x){return x!==null})?out:null;
}
function bestWindow(pr,n){
  var best=null;
  for(var s=0;s+n<=24;s++){var sum=0,ok=true;for(var k=0;k<n;k++){if(pr[s+k]===null){ok=false;break}sum+=pr[s+k]}if(ok&&(!best||sum<best.sum))best={s:s,sum:sum}}
  return best;
}
function todayChart(pr,win){
  var vals=pr.filter(function(x){return x!==null}),mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  var W=340,H=170,l=6,r=6,t=22,b=26,pw=W-l-r,ph=H-t-b,bw=pw/24,nowH=new Date().getHours();
  var s='<svg class="gauge" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Precio de la luz hora a hora">';
  pr.forEach(function(v,i){
    if(v===null)return;
    var hgt=Math.max(3,v/mx*ph),x=l+i*bw,y=t+ph-hgt,inW=win&&i>=win.s&&i<win.s+TODAY.hours;
    s+='<rect class="'+(inW?'fillc':'')+'" style="--k:'+(i%6)+'" data-tip="'+hh2(i)+'\n'+nf(v,3)+' €/kWh" x="'+(x+1).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+hgt.toFixed(1)+'" rx="2.5" fill="'+(inW?'var(--accent)':'var(--muted)')+'" opacity="'+(inW?1:0.45)+'"'+(i===nowH?' stroke="var(--fg)" stroke-width="1.5"':'')+'/>';
  });
  [0,6,12,18,23].forEach(function(i){s+='<text class="svt" x="'+(l+i*bw+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+i+'h</text>'});
  s+='<text class="svt fg lbl" x="'+l+'" y="12">Máx. '+nf(mx,3)+' · Mín. '+nf(mn,3)+' €/kWh</text>';
  return s+'</svg>';
}

  if(!HOSTED)return '<section class="card hero"><h2>Precio de la luz hoy</h2><p class="muted">Esta sección consulta a Red Eléctrica y necesita la versión instalable de Vatio. Aquí dentro no se pueden consultar servicios externos.</p></section>';
  var h='<section class="card hero"><h2>Precio de la luz hoy</h2><p class="muted small">Precio PVPC hora a hora de Red Eléctrica. Solo vale si tienes la tarifa regulada (PVPC); si tienes un plan de mercado libre, tus precios son los de tu plan.</p></section>';

   +'<p class="muted small">El recuadro negro marca la hora actual. Los precios son de la energía y no incluyen peajes, cargos ni impuestos.</p><button class="btn ghost sm" id="hoyGo" type="button" style="align-self:flex-start">Actualizar</button></section>';

function hoyLoad(){

var RT={o:'',d:'',status:'',stops:null,busy:false};
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function geocode(q){return jget('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&q='+encodeURIComponent(q),15000).then(function(r){if(!r||!r[0])throw new Error('no encuentro «'+q+'»');return {lat:parseFloat(r[0].lat),lon:parseFloat(r[0].lon)}})}
function pointAt(coords,total,dkm){
  var cum=[0];for(var i=1;i<coords.length;i++)cum.push(cum[i-1]+hav(coords[i-1][1],coords[i-1][0],coords[i][1],coords[i][0]));
  var len=cum[cum.length-1]||1,target=dkm/total*len;
  for(var j=1;j<coords.length;j++){if(cum[j]>=target){var f=(target-cum[j-1])/Math.max(1e-9,cum[j]-cum[j-1]);return {lat:coords[j-1][1]+(coords[j][1]-coords[j-1][1])*f,lon:coords[j-1][0]+(coords[j][0]-coords[j-1][0])*f}}}
  var e=coords[coords.length-1];return {lat:e[1],lon:e[0]};
}
function routeGo(){
  var key=getKey();
  if(!RT.o.trim()||!RT.d.trim()){toast('Escribe origen y destino');return}
  if(!key){RT.status='Falta la clave de Open Charge Map (pestaña Gratis).';rtShow();return}
  RT.busy=true;RT.stops=null;RT.status='Buscando la ruta…';rtShow();
  var A,B,route;
  geocode(RT.o).then(function(a){A=a;return sleep(1100)}).then(function(){return geocode(RT.d)}).then(function(b){B=b;
    return jget('https://router.project-osrm.org/route/v1/driving/'+A.lon+','+A.lat+';'+B.lon+','+B.lat+'?overview=simplified&geometries=geojson',20000)
  }).then(function(j){
    if(!j||!j.routes||!j.routes[0])throw new Error('sin ruta por carretera');
    route=j.routes[0];S.trip.km=Math.max(1,Math.round(route.distance/1000));save();
    var r=tripCalc(),total=route.distance/1000,pos=[],cons=r.cons,cap=r.cap;
    var d=cap*Math.max(0,S.trip.soc-S.trip.arr)/100/cons*100;
    while(pos.length<r.stops&&d<total-5){pos.push(d);d+=cap*0.6/cons*100}
    RT.stops=[];RT.status=pos.length?'Buscando cargadores en cada parada…':'';
    rtShow();
    var chain=Promise.resolve();
    pos.forEach(function(dk){chain=chain.then(function(){
      var p=pointAt(route.geometry.coordinates,total,dk);
      return jget('https://api.openchargemap.io/v3/poi?output=json&latitude='+p.lat.toFixed(5)+'&longitude='+p.lon.toFixed(5)+'&distance=12&distanceunit=KM&maxresults=150&compact=false&verbose=false&countrycode=ES&key='+encodeURIComponent(key),25000).then(function(arr){
        var pts=(Array.isArray(arr)?arr:[]).map(normPOI).filter(function(q){return q&&q.s!=='fuera'&&q.kw>=50});
        pts.sort(function(a,b){var o={free:0,maybe:1,other:2};return (o[a.cls]-o[b.cls])||(b.kw-a.kw)});
        RT.stops.push({km:dk,pts:pts.slice(0,3)});
      });
    })});
    return chain;
  }).then(function(){RT.busy=false;RT.status=RT.stops&&RT.stops.length?'':(RT.status||'');if(RT.stops&&!RT.stops.length)RT.status='El trayecto no necesita paradas con tu batería.';render()},function(e){RT.busy=false;RT.status='No se pudo completar ('+(e&&e.message?e.message:'sin conexión')+').';render()});
}

function remInfo(r){

/* ---------- CUENTA Y NUBE (Firebase por REST, solo versión alojada) ---------- */
var FBK='vatio.fb',FBS='vatio.fbs';
var CL={cfg:null,sess:null,status:'',busy:false,timer:null,last:0,msg:''};
function clLoad(){try{CL.cfg=JSON.parse(localStorage.getItem(FBK)||'null')}catch(e){CL.cfg=null}try{CL.sess=JSON.parse(localStorage.getItem(FBS)||'null')}catch(e){CL.sess=null}}
function clPut(k,v){try{if(v)localStorage.setItem(k,JSON.stringify(v));else localStorage.removeItem(k)}catch(e){}}
clLoad();
function clReady(){return !!(HOSTED&&CL.cfg&&CL.cfg.apiKey&&CL.cfg.projectId)}
function clOn(){return !!(clReady()&&CL.sess&&CL.sess.refresh)}
var FB_ERR={EMAIL_EXISTS:'Ese correo ya tiene una cuenta. Prueba a entrar.',INVALID_LOGIN_CREDENTIALS:'Correo o contraseña incorrectos.',INVALID_PASSWORD:'Correo o contraseña incorrectos.',EMAIL_NOT_FOUND:'Correo o contraseña incorrectos.',INVALID_EMAIL:'El correo no es válido.',MISSING_PASSWORD:'Escribe la contraseña.',OPERATION_NOT_ALLOWED:'Activa el acceso con correo y contraseña en Firebase (Authentication).',TOO_MANY_ATTEMPTS_TRY_LATER:'Demasiados intentos. Espera unos minutos.',USER_DISABLED:'Esa cuenta está desactivada.',API_KEY_INVALID:'La apiKey de Firebase no es válida.',PERMISSION_DENIED:'Firestore ha rechazado el acceso. Revisa las reglas de seguridad.',PROJECT_NOT_FOUND:'No se encuentra el proyecto de Firebase. Revisa el projectId.'};
function fbMsg(j,st){
  var m=j&&j.error&&j.error.message?String(j.error.message):'';
  if(/WEAK_PASSWORD/.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  var k=m.split(' ')[0].split(':')[0];
  if(FB_ERR[k])return FB_ERR[k];
  var s=j&&j.error&&j.error.status;if(s&&FB_ERR[s])return FB_ERR[s];
  if(st===403)return FB_ERR.PERMISSION_DENIED;
  return 'Error de Firebase'+(m?': '+m:' ('+st+')');
}
function fbJson(url,opt){
  return fetch(url,opt).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok){var e=new Error(fbMsg(j,r.status));e.status=r.status;throw e}return j})});
}
function clSetSess(j){CL.sess={uid:j.localId||j.user_id,email:j.email||(CL.sess&&CL.sess.email)||'',idToken:j.idToken||j.id_token,refresh:j.refreshToken||j.refresh_token,exp:Date.now()+(parseInt(j.expiresIn||j.expires_in,10)||3600)*1000};clPut(FBS,CL.sess)}
function clAuth(mode,email,pass){
  var ep=mode==='up'?'signUp':'signInWithPassword';
  return fbJson('https://identitytoolkit.googleapis.com/v1/accounts:'+ep+'?key='+encodeURIComponent(CL.cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass,returnSecureToken:true})}).then(clSetSess);
}
function clToken(){
  if(CL.sess.exp-60000>Date.now())return Promise.resolve(CL.sess.idToken);
  return fbJson('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(CL.cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(CL.sess.refresh)}).then(function(j){clSetSess(j);return CL.sess.idToken},function(e){if(e.status===400){CL.sess=null;clPut(FBS,null)}throw e});
}
function clUrl(){return 'https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(CL.cfg.projectId)+'/databases/(default)/documents/users/'+encodeURIComponent(CL.sess.uid)}
function clPull(){
  return clToken().then(function(t){return fetch(clUrl(),{headers:{Authorization:'Bearer '+t}})}).then(function(r){
    if(r.status===404)return null;
    return r.text().then(function(tx){var j=null;try{j=JSON.parse(tx)}catch(e){}if(!r.ok){var e=new Error(fbMsg(j,r.status));e.status=r.status;throw e}
      var f=j&&j.fields;if(!f||!f.json||!f.json.stringValue)return null;
      var st=null;try{st=JSON.parse(f.json.stringValue)}catch(e2){}
      return st?{state:st,upd:parseInt((f.upd&&f.upd.integerValue)||st.upd||0,10)||0}:null});
  });
}
function clPush(){
  var body;try{body=JSON.stringify(S)}catch(e){return Promise.reject(e)}
  return clToken().then(function(t){return fbJson(clUrl()+'?updateMask.fieldPaths=json&updateMask.fieldPaths=upd',{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:{json:{stringValue:body},upd:{integerValue:String(S.upd||0)}}})})}).then(function(){CL.last=Date.now()});
}
function clSetMsg(m,render_){CL.msg=m;var el=$('#clMsg');if(el)el.textContent=m}
function clSync(manual){
  if(!clOn()||CL.busy)return Promise.resolve();
  CL.busy=true;clSetMsg('Sincronizando…');
  return clPull().then(function(c){
    if(!c){return clPush().then(function(){clSetMsg('Datos subidos a tu cuenta.')})}
    if(c.upd>(S.upd||0)){
      var st=c.state;S=merge(defaults(),st);S.upd=c.upd;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}applyTheme();render();clSetMsg('Se han cargado los datos más recientes de tu cuenta.');return;
    }
    if((S.upd||0)>c.upd)return clPush().then(function(){clSetMsg('Datos de este dispositivo subidos a tu cuenta.')});
    clSetMsg(manual?'Todo está al día.':'');
  }).catch(function(e){clSetMsg('No se pudo sincronizar: '+(e&&e.message?e.message:'sin conexión'))}).then(function(){CL.busy=false;var el=$('#clLast');if(el)el.textContent=CL.last?'Última subida: '+new Date(CL.last).toLocaleTimeString('es-ES'):''});
}
function clSchedule(){
  if(!clOn())return;
  clearTimeout(CL.timer);
  CL.timer=setTimeout(function(){if(CL.busy){clSchedule();return}CL.busy=true;clPush().then(function(){clSetMsg('Guardado en tu cuenta.')},function(e){clSetMsg('No se pudo guardar en la nube: '+(e&&e.message?e.message:'sin conexión'))}).then(function(){CL.busy=false})},3000);
}
function cuentaHTML(){
  if(!HOSTED)return '<section class="card"><h3>Cuenta y nube</h3><p class="muted small">Esta versión ya guarda tus datos en tu cuenta de Claude. El inicio de sesión propio es para la versión instalable.</p></section>';
  var h='<section class="card"><h3>Cuenta y nube</h3>';
  if(!clReady()){
    return h+'<p class="muted small">Para guardar tus datos en la nube y usarlos desde varios dispositivos necesitas un proyecto gratuito de Firebase. Es un paso de una sola vez.</p>'
     +'<details class="tbl"><summary>Cómo crearlo (5 pasos)</summary><div class="small" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"><span>1. Entra en <a class="link" href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> con tu cuenta de Google y crea un proyecto (puedes desactivar Analytics).</span><span>2. En «Compilación», «Authentication», pulsa «Comenzar» y activa el proveedor «Correo electrónico/contraseña».</span><span>3. En «Firestore Database», crea una base de datos en modo producción.</span><span>4. En Firestore, pestaña «Reglas», pega esto y publica:</span><div class="pre">rules_version = \'2\';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{uid} {\n      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n    }\n  }\n}</div><span>5. En «Configuración del proyecto», «General», crea una app web (icono &lt;/&gt;) y copia el bloque «firebaseConfig». Pégalo aquí abajo.</span><span class="muted">Los nombres de los menús pueden variar un poco: Firebase cambia a menudo su consola.</span></div></details>'
     +'<label class="f" for="fbCfg">Configuración de Firebase<textarea id="fbCfg" rows="5" style="width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--surface2)" placeholder="const firebaseConfig = { apiKey: \'…\', projectId: \'…\' }"></textarea></label>'
     +'<button class="btn" id="fbSaveCfg" type="button">Guardar configuración</button><p class="note" id="clMsg" hidden></p></section>';
  }
  if(!clOn()){
    return h+'<p class="muted small">Proyecto: <b>'+esc(CL.cfg.projectId)+'</b>. Entra o crea tu cuenta con un correo y una contraseña de al menos 6 caracteres.</p>'
     +fld('fbEm','Correo','',{type:'text',data:'autocomplete="email" inputmode="email"'})
     +'<label class="f" for="fbPw">Contraseña<span class="fieldrow"><input id="fbPw" type="password" autocomplete="current-password"></span></label>'
     +'<div class="grid2"><button class="btn" id="fbIn" type="button">Entrar</button><button class="btn ghost" id="fbUp" type="button">Crear cuenta</button></div>'
     +'<button class="btn ghost sm" id="fbReset" type="button" style="align-self:flex-start">He olvidado la contraseña</button>'
     +'<p class="note" id="clMsg"'+(CL.msg?'':' hidden')+'>'+esc(CL.msg)+'</p>'
     +'<button class="btn ghost sm" id="fbDropCfg" type="button" style="align-self:flex-start">Cambiar la configuración de Firebase</button></section>';
  }
  return h+'<div class="rowl"><div class="t"><b>'+esc(CL.sess.email||'Sesión iniciada')+'</b><span class="muted small" id="clLast">'+(CL.last?'Última subida: '+new Date(CL.last).toLocaleTimeString('es-ES'):'Los cambios se suben solos unos segundos después de guardarlos.')+'</span></div><span class="pill ok">Conectado</span></div>'
   +'<div class="grid2"><button class="btn" id="fbSync" type="button">Sincronizar ahora</button><button class="btn ghost" id="fbOut" type="button">Cerrar sesión</button></div>'
   +'<p class="note" id="clMsg"'+(CL.msg?'':' hidden')+'>'+esc(CL.msg)+'</p>'
   +'<p class="muted small">Si usas varios dispositivos, gana siempre la versión más reciente. Tus datos van a tu propio proyecto de Firebase; la clave de Open Charge Map no se sube.</p></section>';
}
function cuentaBind(){
  if(!HOSTED)return;
  var q=function(id,fn){var e=$(id);if(e)e.addEventListener('click',fn)};
  var msg=function(m){var e=$('#clMsg');if(e){e.hidden=false;e.textContent=m}CL.msg=m};
  q('#fbSaveCfg',function(){
    var t=$('#fbCfg').value,a=(t.match(/apiKey["']?\s*[:=]\s*["']([^"']+)["']/)||[])[1],p=(t.match(/projectId["']?\s*[:=]\s*["']([^"']+)["']/)||[])[1];
    if(!a||!p){msg('No encuentro apiKey y projectId en lo que has pegado. Copia el bloque firebaseConfig completo.');return}
    CL.cfg={apiKey:a,projectId:p};clPut(FBK,CL.cfg);CL.msg='';render();
  });
  q('#fbDropCfg',function(){CL.cfg=null;CL.sess=null;clPut(FBK,null);clPut(FBS,null);CL.msg='';render()});
  var go2=function(mode){
    var em=$('#fbEm').value.trim(),pw=$('#fbPw').value;
    if(!em||!pw){msg('Escribe el correo y la contraseña.');return}
    msg('Un momento…');
    clAuth(mode,em,pw).then(function(){CL.sess.email=em;clPut(FBS,CL.sess);CL.msg='';render();return clSync(true)}).then(function(){render()},function(e){msg(e.message)});
  };
  q('#fbIn',function(){go2('in')});q('#fbUp',function(){go2('up')});
  q('#fbReset',function(){
    var em=$('#fbEm').value.trim();if(!em){msg('Escribe tu correo arriba y vuelve a pulsar.');return}
    fbJson('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key='+encodeURIComponent(CL.cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestType:'PASSWORD_RESET',email:em})}).then(function(){msg('Te hemos enviado un correo para cambiar la contraseña. Mira también el spam.')},function(e){msg(e.message)});
  });
  q('#fbSync',function(){clSync(true).then(function(){render()})});
  q('#fbOut',function(){CL.sess=null;clPut(FBS,null);CL.msg='Sesión cerrada. Tus datos siguen en este dispositivo.';render()});
}
